<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Life stats infographic: US and world life expectancy 2026">
  <!-- Card Background -->
  <rect width="920" height="520" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="918" height="518" rx="23" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#111827">Life Stats Infographic: US &amp; World Life Expectancy (2026)</text>
  <text x="48" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Comparing final CDC 2024 US records with 2026 UN World Population Prospects projections</text>

  <!-- Top KPI Cards -->
  <!-- Card 1: US Record -->
  <rect x="48" y="98" width="260" height="122" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="68" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#4338ca" letter-spacing="0.5">US LIFE EXPECTANCY (2024 CDC)</text>
  <text x="68" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="900" fill="#312e81">79.0 yrs</text>
  <text x="68" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#4f46e5">Women: 81.4 · Men: 76.5 (Record)</text>

  <!-- Card 2: World Average -->
  <rect x="330" y="98" width="260" height="122" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="350" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#047857" letter-spacing="0.5">WORLD AVERAGE (2026 UN)</text>
  <text x="350" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="900" fill="#064e3b">73.8 yrs</text>
  <text x="350" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#059669">Women: 76.4 · Men: 71.2</text>

  <!-- Card 3: US Age 65 & Lifetime -->
  <rect x="612" y="98" width="260" height="122" rx="18" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="632" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#be185d" letter-spacing="0.5">US AVERAGE AT AGE 65</text>
  <text x="632" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="900" fill="#831843">+19.7 yrs</text>
  <text x="632" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#db2777">~28,900 days in 79-year life</text>

  <!-- Country Comparison Bars (2026 UN Projections) -->
  <text x="48" y="258" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#111827">Global Spread Across Countries (2026 UN Projections): 31.7-Year Gap</text>

  <!-- Scale: 0 to 90 yrs -> 480px width starting at x=220 (5.333px per year) -->
  <!-- Monaco 86.7 -->
  <text x="204" y="294" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="end">Monaco (#1)</text>
  <rect x="220" y="278" width="462" height="22" rx="6" fill="#4f46e5"/>
  <text x="692" y="294" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#312e81">86.7 yrs</text>

  <!-- San Marino 86.0 -->
  <text x="204" y="328" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="end">San Marino (#2)</text>
  <rect x="220" y="312" width="458" height="22" rx="6" fill="#6366f1"/>
  <text x="688" y="328" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#4338ca">86.0 yrs</text>

  <!-- Japan 85.1 -->
  <text x="204" y="362" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="end">Japan (#3)</text>
  <rect x="220" y="346" width="454" height="22" rx="6" fill="#818cf8"/>
  <text x="684" y="362" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#4338ca">85.1 yrs</text>

  <!-- United States 79.0 -->
  <text x="204" y="396" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#047857" text-anchor="end">United States (2024)</text>
  <rect x="220" y="380" width="421" height="22" rx="6" fill="#10b981"/>
  <text x="651" y="396" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#065f46">79.0 yrs</text>

  <!-- World Average 73.8 -->
  <text x="204" y="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#4b5563" text-anchor="end">World Average</text>
  <rect x="220" y="414" width="393" height="22" rx="6" fill="#64748b"/>
  <text x="623" y="430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#334155">73.8 yrs</text>

  <!-- Nigeria 55.0 -->
  <text x="204" y="464" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#991b1b" text-anchor="end">Nigeria</text>
  <rect x="220" y="448" width="293" height="22" rx="6" fill="#ef4444"/>
  <text x="523" y="464" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#991b1b">55.0 yrs</text>

  <!-- Footer Source -->
  <text x="48" y="498" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Sources: CDC/NCHS (2024 Final Data) · UN World Population Prospects (2026 Projections) · LifeStats.online</text>
</svg>
