<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Global life stats infographic comparing top countries, US life expectancy, global average, healthy life expectancy, and lowest countries">
  <rect width="900" height="470" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="468" rx="23" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#111827">Global Life Stats: Life Expectancy Around the World</text>
  <text x="48" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Comparing leading nations, the United States, world average, healthy life expectancy, and lowest regions</text>

  <!-- Scale: 0 to 90 yrs -> x=240 to x=780 (6px per year) -->
  <g stroke="#f3f4f6" stroke-width="1.5">
    <line x1="240" y1="108" x2="240" y2="392"/>
    <line x1="360" y1="108" x2="360" y2="392"/>
    <line x1="480" y1="108" x2="480" y2="392"/>
    <line x1="600" y1="108" x2="600" y2="392"/>
    <line x1="720" y1="108" x2="720" y2="392"/>
    <line x1="780" y1="108" x2="780" y2="392"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#9ca3af" text-anchor="middle">
    <text x="240" y="410">0</text>
    <text x="360" y="410">20 yrs</text>
    <text x="480" y="410">40 yrs</text>
    <text x="600" y="410">60 yrs</text>
    <text x="720" y="410">80 yrs</text>
    <text x="780" y="410">90 yrs</text>
  </g>

  <!-- Row 1: Hong Kong (~85.5 -> 513px) -->
  <text x="224" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#111827" text-anchor="end">Hong Kong</text>
  <rect x="240" y="114" width="513" height="26" rx="8" fill="#10b981"/>
  <text x="763" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#047857">~85–86 yrs</text>

  <!-- Row 2: Japan (~85 -> 510px) -->
  <text x="224" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#111827" text-anchor="end">Japan</text>
  <rect x="240" y="156" width="510" height="26" rx="8" fill="#10b981"/>
  <text x="760" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#047857">~85 yrs</text>

  <!-- Row 3: South Korea / Peers (~84.5 -> 507px) -->
  <text x="224" y="216" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#111827" text-anchor="end">South Korea / Switz.</text>
  <rect x="240" y="198" width="504" height="26" rx="8" fill="#14b8a6"/>
  <text x="754" y="216" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#0f766e">~84–85 yrs</text>

  <!-- Row 4: United States (79.0 -> 474px) -->
  <text x="224" y="258" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#4f46e5" text-anchor="end">United States (2024)</text>
  <rect x="240" y="240" width="474" height="26" rx="8" fill="#4f46e5"/>
  <text x="724" y="258" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#4338ca">79.0 yrs</text>

  <!-- Row 5: World Average (73.3 -> 439.8px) -->
  <text x="224" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#111827" text-anchor="end">World Average (2023)</text>
  <rect x="240" y="282" width="439.8" height="26" rx="8" fill="#6366f1"/>
  <text x="690" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#4338ca">73.3 yrs</text>

  <!-- Row 6: World Healthy Life Expectancy (62.8 -> 376.8px) -->
  <text x="224" y="342" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="end">World Healthy (HALE)</text>
  <rect x="240" y="324" width="376.8" height="26" rx="8" fill="#f59e0b"/>
  <text x="627" y="342" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#b45309">62.8 yrs</text>

  <!-- Row 7: Chad / Nigeria (~54.5 -> 327px) -->
  <text x="224" y="384" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#be123c" text-anchor="end">Chad / Nigeria</text>
  <rect x="240" y="366" width="327" height="26" rx="8" fill="#f43f5e"/>
  <text x="577" y="384" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#be123c">~54–55 yrs</text>

  <!-- Footer -->
  <text x="48" y="446" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Source: World Health Organization (WHO Global Health Estimates, Oct 2026), UN-derived estimates &amp; CDC · LifeStats.online</text>
</svg>
