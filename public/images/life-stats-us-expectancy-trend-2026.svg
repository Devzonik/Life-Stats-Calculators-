<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Life stats chart showing US life expectancy trend from 2019 to 2024 and gender comparison">
  <defs>
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="lineGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4f46e5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="480" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="478" rx="23" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#111827">US Life Stats Trend: Life Expectancy at Birth (2019–2024)</text>
  <text x="48" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Record 79.0 years overall in 2024 · Women: 81.4 yrs (+0.3) · Men: 76.5 yrs (+0.7)</text>

  <!-- Left panel: Trend line (x: 85 to 580) -->
  <!-- Y scale: 75.0 -> 360, 80.0 -> 130 (46px per 1.0 yr) -->
  <g stroke="#f3f4f6" stroke-width="1.5">
    <line x1="85" y1="130" x2="575" y2="130"/>
    <line x1="85" y1="176" x2="575" y2="176"/>
    <line x1="85" y1="222" x2="575" y2="222"/>
    <line x1="85" y1="268" x2="575" y2="268"/>
    <line x1="85" y1="314" x2="575" y2="314"/>
    <line x1="85" y1="360" x2="575" y2="360"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#9ca3af" text-anchor="end">
    <text x="74" y="134">80.0</text>
    <text x="74" y="180">79.0</text>
    <text x="74" y="226">78.0</text>
    <text x="74" y="272">77.0</text>
    <text x="74" y="318">76.0</text>
    <text x="74" y="364">75.0</text>
  </g>

  <!-- X points: 2019=120, 2020=204, 2021=288, 2022=372, 2023=456, 2024=540 -->
  <!-- Y points: 78.8=185.2, 77.0=268.0, 76.4=295.6, 77.5=245.0, 78.4=203.6, 79.0=176.0 -->
  <path d="M 120 185.2 L 204 268.0 L 288 295.6 L 372 245.0 L 456 203.6 L 540 176.0 L 540 360 L 120 360 Z" fill="url(#trendFill)"/>
  <path d="M 120 185.2 L 204 268.0 L 288 295.6 L 372 245.0 L 456 203.6 L 540 176.0" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)"/>

  <circle cx="120" cy="185.2" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <text x="120" y="168" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#1f2937" text-anchor="middle">78.8</text>

  <circle cx="204" cy="268.0" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <text x="204" y="252" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#1f2937" text-anchor="middle">77.0</text>

  <circle cx="288" cy="295.6" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
  <text x="288" y="324" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">76.4</text>

  <circle cx="372" cy="245.0" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <text x="372" y="229" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#1f2937" text-anchor="middle">77.5</text>

  <circle cx="456" cy="203.6" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <text x="456" y="226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#1f2937" text-anchor="middle">78.4</text>

  <circle cx="540" cy="176.0" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="3"/>
  <rect x="498" y="128" width="84" height="34" rx="9" fill="#4f46e5"/>
  <text x="540" y="149" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">79.0 yrs</text>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#4b5563" text-anchor="middle">
    <text x="120" y="390">2019</text>
    <text x="204" y="390">2020</text>
    <text x="288" y="390">2021</text>
    <text x="372" y="390">2022</text>
    <text x="456" y="390">2023</text>
    <text x="540" y="390" fill="#4f46e5">2024</text>
  </g>

  <!-- Right Panel: 2024 Key Breakdown Cards -->
  <rect x="610" y="120" width="245" height="275" rx="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="632" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#111827">2024 US Breakdown</text>

  <!-- Women Bar -->
  <text x="632" y="185" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#4b5563">Women at birth</text>
  <text x="832" y="185" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="end">81.4 yrs</text>
  <rect x="632" y="195" width="200" height="12" rx="6" fill="#e5e7eb"/>
  <rect x="632" y="195" width="182" height="12" rx="6" fill="#7c3aed"/>

  <!-- Men Bar -->
  <text x="632" y="236" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#4b5563">Men at birth</text>
  <text x="832" y="236" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#4f46e5" text-anchor="end">76.5 yrs</text>
  <rect x="632" y="246" width="200" height="12" rx="6" fill="#e5e7eb"/>
  <rect x="632" y="246" width="171" height="12" rx="6" fill="#4f46e5"/>

  <!-- Gap pill -->
  <rect x="632" y="280" width="200" height="44" rx="12" fill="#eef2ff"/>
  <text x="732" y="299" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#3730a3" text-anchor="middle">Gender Gap: 4.9 Years</text>
  <text x="732" y="315" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="middle">Narrowed by 0.4 yrs vs. 2023</text>

  <!-- Age 65 & Survival -->
  <text x="632" y="352" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#374151">At age 65: +19.7 yrs remaining</text>
  <text x="632" y="374" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">59.0% of newborns reach age 80</text>

  <!-- Footer -->
  <text x="48" y="446" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Source: CDC / National Center for Health Statistics (NCHS), 2024 Final Data &amp; Life Tables · LifeStats.online</text>
</svg>
