<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="Average lifespan of an American male vs female by year (2022 to 2024) and male life expectancy by race (2022)">
  <!-- Card Background -->
  <rect width="920" height="480" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="918" height="478" rx="23" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#111827">American Male Life Expectancy: Trends &amp; Demographics</text>
  <text x="48" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#6b7280">Males rose +1.7 yrs from 2022 (74.8) to 2024 (76.5), narrowing the gender gap to 4.9 years</text>

  <!-- Left Panel: Yearly Trend Comparison (2022-2024) -->
  <rect x="48" y="102" width="400" height="320" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="72" y="136" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Male vs. Female (2022–2024)</text>

  <!-- Legend -->
  <rect x="72" y="152" width="12" height="12" rx="3" fill="#0284c7"/>
  <text x="90" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">Males</text>
  <rect x="150" y="152" width="12" height="12" rx="3" fill="#ec4899"/>
  <text x="168" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">Females</text>

  <!-- 2022: Male 74.8, Female 80.2, Gap 5.4 -->
  <text x="72" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#1e293b">2022</text>
  <text x="424" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">Gap: 5.4 yrs</text>
  <rect x="72" y="210" width="230" height="16" rx="5" fill="#0284c7"/>
  <text x="310" y="222" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#0369a1">74.8</text>
  <rect x="72" y="230" width="268" height="16" rx="5" fill="#ec4899"/>
  <text x="348" y="242" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#be185d">80.2</text>

  <!-- 2023: Male 75.8, Female 81.1, Gap 5.3 -->
  <text x="72" y="278" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#1e293b">2023</text>
  <text x="424" y="278" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">Gap: 5.3 yrs</text>
  <rect x="72" y="288" width="240" height="16" rx="5" fill="#0284c7"/>
  <text x="320" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#0369a1">75.8</text>
  <rect x="72" y="308" width="276" height="16" rx="5" fill="#ec4899"/>
  <text x="356" y="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#be185d">81.1</text>

  <!-- 2024: Male 76.5, Female 81.4, Gap 4.9 -->
  <text x="72" y="356" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#4f46e5">2024 (Latest)</text>
  <text x="424" y="356" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#059669" text-anchor="end">Gap: 4.9 yrs</text>
  <rect x="72" y="366" width="248" height="18" rx="5" fill="#0284c7"/>
  <text x="328" y="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="900" fill="#0369a1">76.5</text>
  <rect x="72" y="388" width="280" height="18" rx="5" fill="#ec4899"/>
  <text x="360" y="402" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="900" fill="#be185d">81.4</text>

  <!-- Right Panel: Male Life Expectancy by Race & Ethnicity (2022 CDC Provisional) -->
  <rect x="472" y="102" width="400" height="320" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="496" y="136" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#1e1b4b">Male Life Expectancy by Group (2022)</text>

  <!-- Asian 82.4 -->
  <text x="496" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#312e81">Asian, non-Hispanic</text>
  <rect x="496" y="184" width="290" height="18" rx="5" fill="#4f46e5"/>
  <text x="794" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#312e81">82.4</text>

  <!-- Hispanic 77.0 -->
  <text x="496" y="226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#312e81">Hispanic</text>
  <rect x="496" y="234" width="256" height="18" rx="5" fill="#6366f1"/>
  <text x="760" y="248" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#312e81">77.0</text>

  <!-- White 75.1 -->
  <text x="496" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#312e81">White, non-Hispanic</text>
  <rect x="496" y="284" width="244" height="18" rx="5" fill="#818cf8"/>
  <text x="748" y="298" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#312e81">75.1</text>

  <!-- Black 69.1 -->
  <text x="496" y="326" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#312e81">Black, non-Hispanic</text>
  <rect x="496" y="334" width="206" height="18" rx="5" fill="#f59e0b"/>
  <text x="710" y="348" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#b45309">69.1</text>

  <!-- AIAN 64.6 -->
  <text x="496" y="376" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#312e81">American Indian / Alaska Native</text>
  <rect x="496" y="384" width="178" height="18" rx="5" fill="#ef4444"/>
  <text x="682" y="398" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#b91c1c">64.6</text>

  <!-- Footer Source -->
  <text x="48" y="456" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Sources: CDC / NCHS Data Brief No. 548 (2024 Final Data) &amp; Provisional 2022 Male Life Expectancy Estimates · LifeStats.online</text>
</svg>
