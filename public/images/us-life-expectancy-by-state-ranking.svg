<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="US life expectancy by state ranking graphic, highest vs lowest states 2022">
  <!-- Card Background -->
  <rect width="900" height="500" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="498" rx="23" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="48" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#111827">US Life Expectancy by State: Highest vs. Lowest (2022)</text>
  <text x="48" y="74" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#6b7280">A 7.8-year gap separates #1 Hawaii (80.0 yrs) from #50 West Virginia (72.2 yrs)</text>

  <!-- Left Column: Highest Ranking States -->
  <rect x="44" y="102" width="396" height="334" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="68" y="136" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#166534">Top 5 Longest-Living States</text>

  <!-- Scale inside column: bar max width 190px for 80.0 (proportional from 68 -> 80.0 is 12 yrs) -->
  <!-- 1. Hawaii: 80.0 -->
  <text x="68" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#14532d">1. Hawaii</text>
  <rect x="200" y="159" width="166" height="24" rx="6" fill="#16a34a"/>
  <text x="376" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#14532d">80.0</text>

  <!-- 2. Massachusetts: 79.8 -->
  <text x="68" y="226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#14532d">2. Massachusetts</text>
  <rect x="200" y="209" width="163" height="24" rx="6" fill="#22c55e"/>
  <text x="373" y="226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#14532d">79.8</text>

  <!-- 3. New Jersey: 79.6 -->
  <text x="68" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#14532d">3. New Jersey</text>
  <rect x="200" y="259" width="160" height="24" rx="6" fill="#22c55e"/>
  <text x="370" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#14532d">79.6</text>

  <!-- 4. New York: 79.5 -->
  <text x="68" y="326" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#14532d">4. New York</text>
  <rect x="200" y="309" width="158" height="24" rx="6" fill="#4ade80"/>
  <text x="368" y="326" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#14532d">79.5</text>

  <!-- 5. Connecticut: 79.4 -->
  <text x="68" y="376" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#14532d">5. Connecticut</text>
  <rect x="200" y="359" width="156" height="24" rx="6" fill="#4ade80"/>
  <text x="366" y="376" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#14532d">79.4</text>

  <text x="68" y="416" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#15803d">Northeast &amp; Pacific states dominate top rankings</text>

  <!-- Right Column: Lowest Ranking States -->
  <rect x="460" y="102" width="396" height="334" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="484" y="136" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#991b1b">Lowest Life Expectancy States</text>

  <!-- Lowest: West Virginia 72.2 -->
  <text x="484" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">50. West Virginia</text>
  <rect x="626" y="159" width="108" height="24" rx="6" fill="#dc2626"/>
  <text x="744" y="176" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d">72.2</text>

  <!-- 49. Mississippi: 72.6 -->
  <text x="484" y="226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">49. Mississippi</text>
  <rect x="626" y="209" width="113" height="24" rx="6" fill="#ef4444"/>
  <text x="749" y="226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d">72.6</text>

  <!-- 48. Kentucky: 73.6 -->
  <text x="484" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">48. Kentucky</text>
  <rect x="626" y="259" width="125" height="24" rx="6" fill="#f87171"/>
  <text x="761" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d">73.6</text>

  <!-- Tied Next Lowest: OK, TN, AL, LA: 73.8 -->
  <text x="484" y="326" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">OK, TN, AL, LA</text>
  <rect x="626" y="309" width="128" height="24" rx="6" fill="#fca5a5"/>
  <text x="764" y="326" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d">73.8</text>

  <!-- Key Spread Box inside Right Column -->
  <rect x="484" y="352" width="348" height="44" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
  <text x="658" y="371" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">Gender gap by state: Smallest in Utah (3.6 yrs)</text>
  <text x="658" y="388" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Largest in New Mexico (6.9 yrs)</text>

  <text x="484" y="416" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">Appalachian &amp; Southern states trail national avg</text>

  <!-- Footer Source -->
  <text x="48" y="472" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Source: CDC / NCHS, U.S. State Life Tables, 2022 (most recent complete state release) · LifeStats.online</text>
</svg>
